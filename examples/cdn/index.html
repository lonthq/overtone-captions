<!doctype html>
<!--
  Overtone captions in video.js from a CDN. Open this file in a browser: no build, no server.
  Swap in your own video and .overtone.json URL.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overtone captions from a CDN</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/video.js@8.24.2/dist/video-js.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/videojs-overtone@0.1.0/dist/themes/base.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/videojs-overtone@0.1.0/dist/themes/clean.css">
  <style>
    body { margin: 0; padding: 24px; background: #111318; color: #e6e8ee; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 960px; margin: 0 auto; }
    p { color: #a9afbc; }
    a { color: #8ab4ff; }
  </style>
</head>
<body>
  <main>
    <h1>Overtone captions from a CDN</h1>

    <video id="player" class="video-js vjs-fluid" controls preload="metadata" playsinline
           src="https://images-assets.nasa.gov/video/ksc_053108_sts124_dutton/ksc_053108_sts124_dutton~mobile.mp4"></video>

    <p>
      Press the captions button (or <kbd>C</kbd>) to cycle off → styled → plain.
      Video: NASA interview <a href="https://images.nasa.gov/details/ksc_053108_sts124_dutton">KSC-08-S-00035</a>,
      streamed from NASA's servers; NASA does not endorse this project.
      Captions: <a href="https://github.com/lonthq/overtone-captions/tree/main/examples/output/nasa">examples/output/nasa</a>.
    </p>
  </main>

  <!-- video.js first: the plugin bundle uses the page's global videojs. -->
  <script src="https://cdn.jsdelivr.net/npm/video.js@8.24.2/dist/video.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/videojs-overtone@0.1.0/dist/index.global.js"></script>
  <script>
    videojs('player').overtone({
      src: 'https://overtone.lont.ai/examples/output/nasa/nasa-dutton.overtone.json',
      theme: 'clean',
      // For iOS native fullscreen, serve the .vtt files next to your page and add:
      // fallbackTracks: { horizontal: 'talk.horizontal.vtt', vertical: 'talk.vertical.vtt' },
    });
  </script>
</body>
</html>
