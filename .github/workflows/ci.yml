name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24] # package.json engines: node >=22.12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Without ffmpeg and ffprobe the pipeline tests skip silently. The Azure apt mirror can hang, so each of three
      # tries has a time limit, and tries 2 and 3 use Ubuntu's main archive.
      - name: Install ffmpeg
        timeout-minutes: 11
        run: |
          for try in 1 2 3; do
            if timeout 90 sudo apt-get update -o Acquire::Retries=3 \
              && timeout 120 sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 ffmpeg; then
              break
            fi
            echo "::warning::ffmpeg install try $try failed or timed out"
            if [ "$try" = 3 ]; then exit 1; fi
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            fi
            sudo sed -i 's#http://azure.archive.ubuntu.com/#http://archive.ubuntu.com/#g' \
              /etc/apt/sources.list /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          done
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      # No provider keys and no OVERTONE_LIVE: the live API test stays skipped.
      - run: npm test
